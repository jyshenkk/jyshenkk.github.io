- title: Unlocking Ultra-High CO₂ Capture Capacity in PMAm-Based Deep Eutectic Gel (DEG) via In Situ Photopolymerization
  authors: Jyue-Yu Shen, Po-Jung Huang
  type: 期刊論文
  venue: "Journal of Environmental Chemical Engineering"
  year: 2026
  doi: "10.1016/j.jece.2026.125915"
  pdf: ""
  link: "https://doi.org/10.1016/j.jece.2026.125915"
  image: ""
  graphic_abstract: /assets/images/graphic-abstract.png
  note: ""
  featured: true
  abstract: >-
    Liquid amine absorbents for CO₂ capture are limited by volatility, corrosion, and viscosity-induced mass transfer resistance. Here, we confine a ChCl/MEA deep eutectic solvent within a polymethacrylamide network through rapid in situ UV photopolymerization, yielding a solid-state deep eutectic gel (DEG) that preserves its amine reactivity and remains structurally intact after CO₂ uptake. The DEG reaches 0.469 g/g at 25 °C and 1.072 g/g at 4 °C, surpassing previously reported amine-functionalized hydrogels.

