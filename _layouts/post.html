---
layout: default
---
<article class="post">
  <header class="post-head">
    <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">部落格</a> · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y.%m.%d" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-foot">
    <a href="{{ '/blog/' | relative_url }}">← 回到所有文章</a>
  </footer>
</article>
